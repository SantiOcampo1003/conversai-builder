[build]
builder = "nixpacks"
buildCommand = "cd conversai-builder && npm ci && npm run build"

[deploy]
startCommand = "cd conversai-builder && npx serve@latest -s dist -l $PORT"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[nixpacks]
providers = ["node"]

[nixpacks.phases.setup]
nixPkgs = ["nodejs_20"]

[nixpacks.phases.install]
cmds = ["cd conversai-builder && npm ci"]

[nixpacks.phases.build]
cmds = ["cd conversai-builder && npm run build"]

